openapi: 3.0.3
info:
  title: CAB System - Authentication API
  version: 1.0.0
  description: 'FR01-FR03: đăng ký tài khoản khách hàng, tài xế và đăng nhập.'
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Authentication
paths:
  /auth/register/customer:
    post:
      tags:
      - Authentication
      summary: Đăng ký tài khoản khách hàng
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/register/driver:
    post:
      tags:
      - Authentication
      summary: Đăng ký/tạo tài khoản tài xế
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRegisterRequest'
      responses:
        '201':
          description: Tạo tài khoản tài xế thành công
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Đăng nhập
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    CustomerRegisterRequest:
      type: object
      required:
      - username
      - password
      - fullName
      - phone
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
    DriverRegisterRequest:
      type: object
      required:
      - username
      - password
      - fullName
      - phone
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        fullName:
          type: string
        phone:
          type: string
        licenseNumber:
          type: string
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        userId:
          type: integer
          format: int64
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - OPERATION_STAFF
          - ADMIN
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Dữ liệu yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực hoặc thông tin xác thực không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []

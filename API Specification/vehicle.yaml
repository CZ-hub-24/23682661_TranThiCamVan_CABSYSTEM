openapi: 3.0.3
info:
  title: CAB System - Vehicle API (FULL CRUD)
  version: 1.0.0
  description: FR05, FR28. Quản lý phương tiện là tài nguyên quản trị nên có đủ CRUD.
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Vehicles
paths:
  /vehicles:
    get:
      tags:
      - Vehicles
      summary: READ - Danh sách vehicles
      responses:
        '200':
          description: Danh sách dữ liệu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
    post:
      tags:
      - Vehicles
      summary: CREATE - Tạo vehicles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleCreateRequest'
      responses:
        '201':
          description: Tạo thành công
        '400':
          $ref: '#/components/responses/BadRequest'
  /vehicles/{vehicleId}:
    get:
      tags:
      - Vehicles
      summary: READ - Chi tiết vehicles
      parameters:
      - name: vehicleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Chi tiết dữ liệu
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Vehicles
      summary: UPDATE - Cập nhật vehicles
      parameters:
      - name: vehicleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Vehicles
      summary: DELETE - Xóa vehicles
      parameters:
      - name: vehicleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Xóa thành công
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Vehicle:
      type: object
      properties:
        vehicleId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
        licensePlate:
          type: string
        vehicleType:
          type: string
        brand:
          type: string
        model:
          type: string
        status:
          type: string
    VehicleCreateRequest:
      type: object
      required:
      - driverId
      - licensePlate
      - vehicleType
      properties:
        driverId:
          type: integer
          format: int64
        licensePlate:
          type: string
        vehicleType:
          type: string
        brand:
          type: string
        model:
          type: string
        status:
          type: string
    VehicleUpdateRequest:
      type: object
      properties:
        licensePlate:
          type: string
        vehicleType:
          type: string
        brand:
          type: string
        model:
          type: string
        status:
          type: string
  responses:
    BadRequest:
      description: Dữ liệu yêu cầu không hợp lệ
    Unauthorized:
      description: Chưa xác thực hoặc không đủ quyền
    NotFound:
      description: Không tìm thấy tài nguyên
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []

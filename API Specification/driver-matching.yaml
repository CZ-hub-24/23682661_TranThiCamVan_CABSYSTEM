openapi: 3.0.3
info:
  title: CAB System - Driver Matching API
  version: 1.0.0
  description: 'FR09-FR14: xác định, ưu tiên, gửi yêu cầu, xử lý phản hồi và tìm tài
    xế thay thế.'
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Matching
paths:
  /matching/trips/{tripId}/start:
    post:
      tags:
      - Matching
      summary: Tìm và ưu tiên tài xế phù hợp
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Kết quả matching
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResult'
  /matching/trips/{tripId}/driver-response:
    post:
      tags:
      - Matching
      summary: Ghi nhận phản hồi tài xế
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverResponseRequest'
      responses:
        '200':
          description: Đã ghi nhận; nếu từ chối/không phản hồi hệ thống tiếp tục tìm
            tài xế khác
components:
  schemas:
    MatchResult:
      type: object
      properties:
        tripId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum:
          - MATCHING
          - DRIVER_PROPOSED
          - ASSIGNED
          - NO_DRIVER_FOUND
    DriverResponseRequest:
      type: object
      required:
      - accepted
      properties:
        accepted:
          type: boolean
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Dữ liệu yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực hoặc thông tin xác thực không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []

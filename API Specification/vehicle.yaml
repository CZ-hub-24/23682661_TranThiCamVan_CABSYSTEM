openapi: 3.0.3
info:
  title: CAB System - Vehicle API
  version: 1.0.0
  description: 'FR05, FR28: quản lý thông tin phương tiện.'
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Vehicles
paths:
  /drivers/me/vehicles:
    get:
      tags:
      - Vehicles
      summary: Xem phương tiện của tài xế
      responses:
        '200':
          description: Danh sách phương tiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
    post:
      tags:
      - Vehicles
      summary: Thêm phương tiện
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Thêm phương tiện thành công
  /drivers/me/vehicles/{vehicleId}:
    patch:
      tags:
      - Vehicles
      summary: Cập nhật thông tin phương tiện
      parameters:
      - name: vehicleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Cập nhật phương tiện thành công
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Vehicle:
      type: object
      properties:
        vehicleId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
        licensePlate:
          type: string
        vehicleType:
          type: string
        brand:
          type: string
        model:
          type: string
        status:
          type: string
    VehicleRequest:
      type: object
      required:
      - licensePlate
      - vehicleType
      properties:
        licensePlate:
          type: string
        vehicleType:
          type: string
        brand:
          type: string
        model:
          type: string
        status:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Dữ liệu yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực hoặc thông tin xác thực không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []

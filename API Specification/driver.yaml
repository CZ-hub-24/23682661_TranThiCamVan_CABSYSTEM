openapi: 3.0.3
info:
  title: CAB System - Driver API (FULL CRUD)
  version: 1.0.0
  description: FR05, FR16, FR28, FR30. Quản lý tài xế là tài nguyên quản trị nên có
    đủ CRUD.
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Drivers
paths:
  /drivers:
    get:
      tags:
      - Drivers
      summary: READ - Danh sách drivers
      responses:
        '200':
          description: Danh sách dữ liệu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
    post:
      tags:
      - Drivers
      summary: CREATE - Tạo drivers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverCreateRequest'
      responses:
        '201':
          description: Tạo thành công
        '400':
          $ref: '#/components/responses/BadRequest'
  /drivers/{driverId}:
    get:
      tags:
      - Drivers
      summary: READ - Chi tiết drivers
      parameters:
      - name: driverId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Chi tiết dữ liệu
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Drivers
      summary: UPDATE - Cập nhật drivers
      parameters:
      - name: driverId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Drivers
      summary: DELETE - Xóa drivers
      parameters:
      - name: driverId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Xóa thành công
        '404':
          $ref: '#/components/responses/NotFound'
  /drivers/{driverId}/location:
    patch:
      tags:
      - Drivers
      summary: Cập nhật vị trí tài xế
      parameters:
      - name: driverId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '200':
          description: Cập nhật vị trí thành công
components:
  schemas:
    Driver:
      type: object
      properties:
        driverId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        fullName:
          type: string
        phone:
          type: string
        licenseNumber:
          type: string
        status:
          type: string
        available:
          type: boolean
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    DriverCreateRequest:
      type: object
      required:
      - fullName
      - phone
      properties:
        fullName:
          type: string
        phone:
          type: string
        licenseNumber:
          type: string
    DriverUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        licenseNumber:
          type: string
        status:
          type: string
        available:
          type: boolean
    LocationRequest:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
  responses:
    BadRequest:
      description: Dữ liệu yêu cầu không hợp lệ
    Unauthorized:
      description: Chưa xác thực hoặc không đủ quyền
    NotFound:
      description: Không tìm thấy tài nguyên
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []

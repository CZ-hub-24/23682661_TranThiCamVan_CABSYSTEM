openapi: 3.0.3
info:
  title: CAB System - Customer API (FULL CRUD)
  version: 1.0.0
  description: FR04, FR28. Quản lý khách hàng là tài nguyên quản trị nên có đủ CRUD.
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Customers
paths:
  /customers:
    get:
      tags:
      - Customers
      summary: READ - Danh sách customers
      responses:
        '200':
          description: Danh sách dữ liệu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      tags:
      - Customers
      summary: CREATE - Tạo customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
      responses:
        '201':
          description: Tạo thành công
        '400':
          $ref: '#/components/responses/BadRequest'
  /customers/{customerId}:
    get:
      tags:
      - Customers
      summary: READ - Chi tiết customers
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Chi tiết dữ liệu
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Customers
      summary: UPDATE - Cập nhật customers
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Customers
      summary: DELETE - Xóa customers
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Xóa thành công
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Customer:
      type: object
      properties:
        customerId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        status:
          type: string
    CustomerCreateRequest:
      type: object
      required:
      - fullName
      - phone
      properties:
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
    CustomerUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        status:
          type: string
  responses:
    BadRequest:
      description: Dữ liệu yêu cầu không hợp lệ
    Unauthorized:
      description: Chưa xác thực hoặc không đủ quyền
    NotFound:
      description: Không tìm thấy tài nguyên
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []

openapi: 3.0.3
info:
  title: CAB System - Notification & Rating API
  version: 1.0.0
  description: 'FR23-FR24, FR27: thông báo khách hàng/tài xế và đánh giá tài xế.'
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Notifications
- name: Ratings
paths:
  /notifications:
    get:
      tags:
      - Notifications
      summary: Xem thông báo của người dùng
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
  /trips/{tripId}/rating:
    post:
      tags:
      - Ratings
      summary: Đánh giá tài xế sau khi hoàn thành chuyến
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Ghi nhận đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
components:
  schemas:
    Notification:
      type: object
      properties:
        notificationId:
          type: integer
          format: int64
        tripId:
          type: integer
          format: int64
          nullable: true
        type:
          type: string
        message:
          type: string
        status:
          type: string
    RatingRequest:
      type: object
      required:
      - score
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
    Rating:
      type: object
      properties:
        ratingId:
          type: integer
          format: int64
        tripId:
          type: integer
          format: int64
        score:
          type: integer
        comment:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Dữ liệu yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực hoặc thông tin xác thực không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []

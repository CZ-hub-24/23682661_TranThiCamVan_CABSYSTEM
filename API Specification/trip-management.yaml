openapi: 3.0.3
info:
  title: CAB System - Trip Management API
  version: 1.0.0
  description: 'FR15, FR17, FR18, FR25: quản lý, theo dõi và lịch sử chuyến.'
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Trips
paths:
  /trips/{tripId}:
    get:
      tags:
      - Trips
      summary: Theo dõi chuyến và xem thông tin tài xế
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Thông tin chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{tripId}/status:
    patch:
      tags:
      - Trips
      summary: Cập nhật trạng thái chuyến
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
  /trips/history:
    get:
      tags:
      - Trips
      summary: Xem lịch sử chuyến đi
      responses:
        '200':
          description: Danh sách lịch sử chuyến
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
components:
  schemas:
    Trip:
      type: object
      properties:
        tripId:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
          nullable: true
        pickupLocation:
          type: string
        destination:
          type: string
        status:
          type: string
        estimatedArrivalTime:
          type: string
          format: date-time
          nullable: true
    TripStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - DRIVER_ASSIGNED
          - DRIVER_ARRIVED
          - CUSTOMER_PICKED_UP
          - IN_PROGRESS
          - COMPLETED
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Dữ liệu yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực hoặc thông tin xác thực không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []

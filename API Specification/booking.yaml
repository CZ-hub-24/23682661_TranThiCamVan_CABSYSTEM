openapi: 3.0.3
info:
  title: CAB System - Booking API
  version: 1.0.0
  description: 'FR06-FR08: đặt xe và tiếp nhận yêu cầu.'
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Booking
paths:
  /bookings:
    post:
      tags:
      - Booking
      summary: Tạo yêu cầu đặt xe
      description: 'FR06-FR08: nhập thông tin chuyến, tạo và tiếp nhận yêu cầu đặt
        xe.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Yêu cầu đặt xe đã được tiếp nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  schemas:
    CreateTripRequest:
      type: object
      required:
      - pickupLocation
      - destination
      - vehicleType
      properties:
        pickupLocation:
          type: string
        destination:
          type: string
        vehicleType:
          type: string
    TripCreated:
      type: object
      properties:
        tripId:
          type: integer
          format: int64
        status:
          type: string
          example: SEARCHING_DRIVER
        pickupLocation:
          type: string
        destination:
          type: string
        vehicleType:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Dữ liệu yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực hoặc thông tin xác thực không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []
